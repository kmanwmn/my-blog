<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网络通话 · 个人博客</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#03050a;color:#e0e4ee;overflow:hidden;transition:background .4s,color .4s}
body.light{background:#f5f7fa;color:#1a2a3a}

/* 导航 */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(3,5,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,158,255,.1);padding:14px 0}
body.light nav{background:rgba(245,247,250,.95);border-bottom-color:rgba(0,0,0,.06)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 24px}
.nav-brand{font-size:.9rem;font-weight:700;color:#fff;text-decoration:none;letter-spacing:1px}
body.light .nav-brand{color:#1a2a3a}
.nav-right{display:flex;align-items:center;gap:10px}
.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(74,158,255,.25);background:rgba(74,158,255,.1);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .3s;color:#4a9eff}
.theme-btn:hover{background:rgba(74,158,255,.2)}
.nav-home{color:#6a8ab5;text-decoration:none;font-size:.82rem;transition:color .3s}
.nav-home:hover{color:#4a9eff}
body.light .nav-home{color:#5a6a7a}
body.light .nav-home:hover{color:#4a9eff}
.logout-btn{background:none;border:none;color:#e04040;font-size:.8rem;cursor:pointer;font-family:inherit;padding:4px 6px}
.logout-btn:hover{color:#f87171}
body.light .logout-btn{color:#d03030}
body.light .logout-btn:hover{color:#ff5252}

/* 页面主体 */
.main-wrap{height:100vh;display:flex;flex-direction:column;padding:70px 0 0}

/* ===== 登录界面 ===== */
.login-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:40px 36px;width:360px;max-width:100%;text-align:center}
body.light .login-card{background:#fff;border-color:rgba(0,0,0,.06)}
.login-card h2{font-size:1.2rem;margin-bottom:6px}
.login-card .sub{font-size:.82rem;color:#6a8ab5;margin-bottom:24px}
body.light .login-card .sub{color:#5a6a7a}
.login-card input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#e0e4ee;font-size:.9rem;font-family:inherit;outline:none;transition:border .3s;margin-bottom:14px;text-align:center}
.login-card input:focus{border-color:#4a9eff}
body.light .login-card input{background:#fff;border-color:rgba(0,0,0,.1);color:#1a2a3a}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#4a9eff;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .3s;font-family:inherit}
.login-btn:hover{background:#3a8aee}
.login-btn:disabled{background:#2a4a6a;cursor:not-allowed}
.login-error{color:#e04040;font-size:.8rem;margin-bottom:10px;display:none}

/* ===== 通话界面 ===== */
.call-screen{flex:1;display:none;position:relative;background:#000}

/* 视频窗口：默认 远端铺满(主) + 本地小窗(副 .pip)；点小窗可互换 */
#remoteVideo,#localVideo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#0a0a0a}
#localVideo{transform:scaleX(-1);display:none} /* 本地预览镜像；初始隐藏，由 JS 显示 */
#remoteVideo.pip,#localVideo.pip{width:200px;height:150px;object-fit:contain;border-radius:10px;border:2px solid rgba(74,158,255,.3);background:#0a0a0a;z-index:10;top:auto;bottom:100px;right:20px;left:auto;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.45)}
@media(max-width:600px){#remoteVideo.pip,#localVideo.pip{width:140px;height:105px;bottom:90px;right:10px}}

/* 无摄像头画面占位 */
.video-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3a4a5a;font-size:4rem;pointer-events:none;z-index:1}
body.light .video-placeholder{color:#b0c0d0}

/* 底部控制栏 */
.controls{position:absolute;bottom:0;left:0;right:0;z-index:20;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:40px 24px 24px;display:flex;align-items:center;justify-content:center;gap:16px}
.ctrl-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:1.3rem;transition:all .3s;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff}
.ctrl-btn:hover{background:rgba(255,255,255,.2)}
.ctrl-btn.danger{background:#e04040}
.ctrl-btn.danger:hover{background:#cc3030}
.ctrl-btn.success{background:#4a9eff}
.ctrl-btn.success:hover{background:#3a8aee}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed}

/* 拨号面板 */
.dial-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;text-align:center;display:none}
.dial-panel.show{display:block}
.dial-panel h3{font-size:1rem;margin-bottom:6px;color:#fff}
.dial-panel .sub{font-size:.8rem;color:#8a9bb5;margin-bottom:16px}
.dial-input{width:260px;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:1rem;font-family:inherit;outline:none;text-align:center;margin-bottom:12px}
.dial-input:focus{border-color:#4a9eff}
.dial-input::placeholder{color:#5a7a9a}

/* 状态栏 */
.status-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:15;padding:6px 18px;border-radius:20px;font-size:.78rem;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#b0c0d0;display:none;white-space:nowrap}
.status-bar.show{display:block}
.status-bar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.green{background:#4caf50}
.dot.yellow{background:#ffc107}
.dot.red{background:#e04040}
.dot.blue{background:#4a9eff}

/* 空闲状态（未通话时显示拨号盘） */
.idle-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;text-align:center;width:90%;max-width:360px}
.idle-panel h3{font-size:1.3rem;color:#fff;margin-bottom:6px}
.idle-panel .sub{font-size:.85rem;color:#8a9bb5;margin-bottom:20px}
.idle-panel .sub strong{color:#4a9eff}
.idle-input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:1rem;font-family:inherit;outline:none;text-align:center;margin-bottom:14px}
.idle-input:focus{border-color:#4a9eff}
.idle-input::placeholder{color:#5a7a9a}
.call-btn{width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,#4caf50,#66bb6a);color:#fff;font-size:1.5rem;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(76,175,80,.3)}
.call-btn:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(76,175,80,.4)}
.call-btn:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed}

/* 通用 */
.hidden{display:none!important}
</style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="/" class="nav-brand">个人博客</a>
        <div class="nav-right">
            <button class="theme-btn" id="themeBtn">☀️</button>
            <button class="logout-btn hidden" id="logoutBtn" onclick="doLogout()" title="退出登录并释放昵称">退出</button>
            <a href="/" class="nav-home">← 首页</a>
        </div>
    </div>
</nav>

<div class="main-wrap">

<!-- ===== 登录界面 ===== -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <h2>📞 网络通话</h2>
        <p class="sub">输入昵称，开始通话</p>
        <div class="login-error" id="loginError"></div>
        <input type="text" id="loginName" placeholder="输入你的昵称..." maxlength="20" autocomplete="off" />
        <button class="login-btn" id="loginBtn" onclick="doLogin()">登录</button>
    </div>
</div>

<!-- ===== 通话界面 ===== -->
<div class="call-screen" id="callScreen">
    <!-- 远端视频 -->
    <video id="remoteVideo" autoplay playsinline></video>
    <!-- 本地视频 -->
    <video id="localVideo" class="pip" autoplay playsinline muted title="点击互换大小窗口"></video>
    <!-- 无摄像头占位 -->
    <div class="video-placeholder" id="videoPlaceholder">📹</div>
    <!-- 状态条 -->
    <div class="status-bar" id="statusBar"><span class="dot green"></span><span id="statusText">空闲</span></div>
    <!-- 空闲拨号面板 -->
    <div class="idle-panel" id="idlePanel">
        <h3>呼叫对方</h3>
        <p class="sub">当前在线：<span id="onlineHint">—</span></p>
        <input class="idle-input" id="targetName" placeholder="输入对方昵称..." maxlength="20" autocomplete="off" />
        <div>
            <button class="call-btn" id="callBtn" onclick="startCall()">📞</button>
        </div>
    </div>
    <!-- 通话中拨号面板 -->
    <div class="dial-panel" id="dialPanel">
        <h3 id="callStatusText">正在呼叫...</h3>
        <p class="sub" id="callTargetText">对方: <strong id="callTargetName"></strong></p>
        <div style="display:flex;justify-content:center;gap:12px">
            <button class="ctrl-btn success hidden" id="answerBtn" onclick="answerCall()" title="接听">📞</button>
            <button class="ctrl-btn danger" id="hangupBtn" onclick="hangup()">✕</button>
        </div>
    </div>
    <!-- 底部控制栏（备用挂断） -->
    <div class="controls" id="controls">
        <button class="ctrl-btn" id="micBtn" onclick="toggleMic()" title="麦克风">🎤</button>
        <button class="ctrl-btn" id="camBtn" onclick="toggleCam()" title="摄像头">📷</button>
        <button class="ctrl-btn danger hidden" id="hangupBtn2" onclick="hangup()" title="挂断">✕</button>
    </div>
</div>

</div>

<script>
(function(){
    // ===== 状态 =====
    var WS_URL = 'wss://upload.sensing-origin.cn:8080/ws/';
    var ws = null;
    var localStream = null;
    var pc = null;
    var pendingCandidates = [];   // 远程描述未就绪前缓存的 ICE candidate
    var myName = '';
    var targetName = '';
    var inCall = false;
    var awaitingAnswer = false;   // 主叫：等待对方 answer
    var incomingPending = false;  // 被叫：已收到 offer 等待用户接听/拒接
    var isLoginScreen = true;
    var callDirection = '';       // 'outgoing' | 'incoming'
    var errorTimer = null;
    var sessionStarted = false;   // 首次登录成功后才初始化界面（重连不再重置）
    var reconnectTimer = null;    // 防重复重连

    // ===== DOM =====
    function $(id){ return document.getElementById(id); }
    var loginScreen = $('loginScreen'), callScreen = $('callScreen');
    var loginName = $('loginName'), loginBtn = $('loginBtn'), loginError = $('loginError');
    var localVideo = $('localVideo'), remoteVideo = $('remoteVideo'), videoPlaceholder = $('videoPlaceholder');
    var statusBar = $('statusBar'), statusText = $('statusText');
    var idlePanel = $('idlePanel'), targetNameInput = $('targetName'), callBtn = $('callBtn');
    var dialPanel = $('dialPanel'), callStatusText = $('callStatusText'), callTargetName = $('callTargetName');
    var hangupBtn = $('hangupBtn'), hangupBtn2 = $('hangupBtn2'), answerBtn = $('answerBtn');
    var micBtn = $('micBtn'), camBtn = $('camBtn'), onlineHint = $('onlineHint');
    var logoutBtn = $('logoutBtn');

    // ===== 主题 =====
    var themeBtn = $('themeBtn');
    function applyTheme(t){
        document.body.classList.toggle('light', t === 'light');
        themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
    }
    var saved = (function(){ try{ return localStorage.getItem('blog-theme'); }catch(e){ return null; } })();
    applyTheme(saved === 'dark' ? 'dark' : 'light');
    themeBtn.onclick = function(){
        var isLight = document.body.classList.contains('light');
        applyTheme(isLight ? 'dark' : 'light');
        try{ localStorage.setItem('blog-theme', isLight ? 'dark' : 'light'); }catch(e){}
    };

    // ===== 工具 =====
    function showLoginError(msg){ loginError.textContent = msg; loginError.style.display = 'block'; }
    function hideLoginError(){ loginError.style.display = 'none'; }

    function setStatus(state, msg){
        statusBar.classList.add('show');
        var dot = statusBar.querySelector('.dot');
        dot.className = 'dot';
        var map = { idle:'green', calling:'yellow', ringing:'blue', connected:'green', error:'red' };
        dot.classList.add(map[state] || 'green');
        statusText.textContent = msg || '';
    }
    function showError(msg){
        setStatus('error', msg);
        if(errorTimer) clearTimeout(errorTimer);
        errorTimer = setTimeout(function(){ setStatus('idle'); }, 8000);
    }

    function showScreen(login){
        isLoginScreen = login;
        loginScreen.style.display = login ? 'flex' : 'none';
        callScreen.style.display = login ? 'none' : 'block';
    }

    // 按“是否真有对应轨道”决定按钮可用性，避免通话中被误禁用
    function refreshMediaButtons(){
        var hasAudio = !!(localStream && localStream.getAudioTracks().length);
        var hasVideo = !!(localStream && localStream.getVideoTracks().length);
        micBtn.disabled = !hasAudio;
        camBtn.disabled = !hasVideo;
        if(hasAudio) micBtn.style.opacity = '1';
        if(hasVideo) camBtn.style.opacity = '1';
    }

    function resetUI(){
        inCall = false;
        incomingPending = false;
        awaitingAnswer = false;
        callDirection = '';
        targetName = '';
        dialPanel.classList.remove('show');
        idlePanel.style.display = 'block';
        hangupBtn2.classList.add('hidden');
        answerBtn.classList.add('hidden');
        refreshMediaButtons();
        setStatus('idle');
    }

    // ===== 信令 =====
    function sendSignaling(obj){
        if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    function connectSignaling(name){
        ws = new WebSocket(WS_URL);
        ws.onopen = function(){ sendSignaling({ type:'login', name: name }); };
        ws.onmessage = function(e){
            try { handleSignaling(JSON.parse(e.data)); }
            catch(err){ console.warn('解析消息失败:', e.data); }
        };
        ws.onclose = function(){
            if(!isLoginScreen && myName){
                showError('信令连接断开，3 秒后重连…');
                if(reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(function(){
                    reconnectTimer = null;
                    if(!isLoginScreen && myName){ connectSignaling(myName); }
                }, 3000);
            }
        };
        ws.onerror = function(){
            if(isLoginScreen){ showLoginError('无法连接信令服务器'); loginBtn.disabled = false; }
        };
    }

    // ===== 媒体（本地预览，加约束防高分辨率卡顿） =====
    async function startMedia(){
        // 摄像头要求安全上下文：非 https/localhost 下浏览器会直接禁用
        if(!window.isSecureContext){
            console.warn('非安全上下文，摄像头被浏览器禁用');
            videoPlaceholder.style.display = 'flex';
            videoPlaceholder.innerHTML = '🚫<div style="font-size:1rem;color:#f87171;margin-top:10px">浏览器禁止摄像头：请用 <b>https://</b> 地址打开本页（当前是 http 非安全页）</div>';
            localVideo.style.display = 'none';
            setStatus('error', '当前为 http 非安全页，浏览器禁止摄像头，请改用 https 地址');
            return;
        }
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
            console.warn('当前浏览器不支持 getUserMedia');
            videoPlaceholder.style.display = 'flex';
            localVideo.style.display = 'none';
            return;
        }
        var lastErr = null;
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { width:{ ideal:1280 }, height:{ ideal:720 }, frameRate:{ ideal:30 } },
                audio: { echoCancellation:true, noiseSuppression:true }
            });
        } catch(e1) {
            lastErr = e1;
            try {
                // 降级：摄像头不支持指定分辨率时退回系统默认
                localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
            } catch(e2) {
                lastErr = e2;
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
                } catch(e3) {
                    lastErr = e3;
                    console.warn('获取媒体设备失败:', e1, e2, e3);
                }
            }
        }
        if(localStream){
            localVideo.srcObject = localStream;
            localVideo.style.display = 'block';
            videoPlaceholder.style.display = 'none';
            refreshMediaButtons();
        } else {
            // 无视频/无音频：给出明确原因，避免“黑屏不知为何”
            videoPlaceholder.style.display = 'flex';
            localVideo.style.display = 'none';
            refreshMediaButtons();
            var reason = '无法开启摄像头/麦克风';
            var code = (lastErr && lastErr.name) || '';
            if(code === 'NotAllowedError' || code === 'PermissionDeniedError'){
                reason = '摄像头/麦克风权限被拒绝：请点地址栏的摄像头图标允许';
            } else if(code === 'NotFoundError' || code === 'DevicesNotFoundError'){
                reason = '未检测到摄像头/麦克风设备';
            } else if(code === 'NotReadableError' || code === 'TrackStartError'){
                reason = '摄像头被其他程序占用，请关闭占用程序后刷新';
            }
            console.warn('媒体不可用:', code, lastErr);
            videoPlaceholder.innerHTML = '📹<div style="font-size:.9rem;color:#6a8ab5;margin-top:10px">' + reason + '</div>';
            setStatus('error', reason);
        }
    }

    function stopMedia(){
        if(localStream){
            localStream.getTracks().forEach(function(t){ t.stop(); });
            localStream = null;
        }
        localVideo.srcObject = null;
        localVideo.style.display = 'none';
    }

    function toggleMic(){
        if(!localStream) return;
        var at = localStream.getAudioTracks()[0];
        if(at){ at.enabled = !at.enabled; micBtn.style.opacity = at.enabled ? '1' : '.4'; }
    }
    function toggleCam(){
        if(!localStream) return;
        var vt = localStream.getVideoTracks()[0];
        if(vt){
            vt.enabled = !vt.enabled;
            camBtn.style.opacity = vt.enabled ? '1' : '.4';
            localVideo.style.display = vt.enabled ? 'block' : 'none';
            videoPlaceholder.style.display = vt.enabled ? 'none' : 'flex';
        }
    }

    // ===== WebRTC =====
    function createPeerConnection(){
        closePeer(); // 确保单例
        var config = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.miwifi.com:3478'] }] };
        pc = new RTCPeerConnection(config);

        pc.onicecandidate = function(e){
            // 仅在通话协商期间发送；candidate 由对端在 remoteDescription 就绪后缓存处理
            if(e.candidate && targetName && callDirection){
                sendSignaling({
                    type:'candidate', from: myName, to: targetName,
                    candidate: e.candidate.candidate,
                    sdp_mid: e.candidate.sdpMid,
                    mline_index: e.candidate.sdpMLineIndex
                });
            }
        };

        pc.ontrack = function(e){
            // 兜底：个别浏览器 e.streams 为空时用 track 组流
            var stream = (e.streams && e.streams[0]) ? e.streams[0] : new MediaStream([e.track]);
            remoteVideo.srcObject = stream;
        };

        pc.oniceconnectionstatechange = function(){
            if(!pc) return;
            var st = pc.iceConnectionState;
            if(st === 'connected' || st === 'completed'){
                setStatus('connected', '与 ' + targetName + ' 通话中');
            } else if(st === 'failed'){
                showError('连接失败，请挂断重试');
            } else if(st === 'disconnected'){
                showError('连接不稳定…');
            }
        };

        // 添加本地轨道
        if(localStream){
            localStream.getTracks().forEach(function(track){ pc.addTrack(track, localStream); });
        }
        return pc;
    }

    function closePeer(){
        if(pc){ try{ pc.close(); }catch(e){} pc = null; }
        pendingCandidates = [];
    }

    // 添加远端 candidate：remoteDescription 未就绪先缓存，就绪后 flush
    function addRemoteCandidate(msg){
        if(!pc) return;
        var doAdd = function(c){
            pc.addIceCandidate(new RTCIceCandidate({
                candidate: c.candidate, sdpMid: c.sdp_mid, sdpMLineIndex: c.mline_index
            })).catch(function(){});
        };
        if(pc.remoteDescription){ doAdd(msg); }
        else { pendingCandidates.push(msg); }
    }
    function flushCandidates(){
        while(pendingCandidates.length){
            var c = pendingCandidates.shift();
            pc.addIceCandidate(new RTCIceCandidate({
                candidate: c.candidate, sdpMid: c.sdp_mid, sdpMLineIndex: c.mline_index
            })).catch(function(){});
        }
    }

    // ===== 信令处理 =====
    function handleSignaling(msg){
        switch(msg.type){
            case 'login':
                if(msg.ok){
                    hideLoginError();
                    if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
                    if(!sessionStarted){
                        // 仅首次登录初始化界面/媒体；重连成功不重置进行中的通话
                        sessionStarted = true;
                        showScreen(false);
                        resetUI();
                        startMedia();
                        logoutBtn.classList.remove('hidden');
                        setStatus('idle');
                    }
                } else {
                    var occReason = (msg.reason || '');
                    if(occReason.indexOf('占用') >= 0){
                        occReason += '（若这是你自己上次的页面，请先关闭旧标签页，或点右上角“退出”）';
                    }
                    showLoginError(occReason || '登录失败');
                    loginBtn.disabled = false;
                    if(ws){ ws.close(); ws = null; }
                }
                break;

            case 'offer':
                // 收到来电：立即建 pc 并设置远端 offer，使后续 candidate 不丢失；answer 留待用户点击接听
                targetName = msg.from;
                callDirection = 'incoming';
                incomingPending = true;
                inCall = false;
                awaitingAnswer = false;

                createPeerConnection();
                pc.setRemoteDescription(new RTCSessionDescription({ type:'offer', sdp: msg.sdp }))
                    .then(function(){ flushCandidates(); })
                    .catch(function(err){ console.error('setRemote(offer) 失败:', err); });

                callTargetName.textContent = targetName;
                callStatusText.textContent = '📞 来电';
                dialPanel.classList.add('show');
                idlePanel.style.display = 'none';
                answerBtn.classList.remove('hidden');
                hangupBtn2.classList.remove('hidden');
                setStatus('ringing', '来自 ' + targetName + ' 的呼叫');

                sendSignaling({ type:'ringing', from: myName, to: targetName });
                break;

            case 'ringing':
                if(callDirection === 'outgoing' && awaitingAnswer){
                    callStatusText.textContent = '🔔 振铃中';
                    setStatus('ringing', targetName + ' 振铃中…');
                }
                break;

            case 'answer':
                awaitingAnswer = false;
                if(pc){
                    pc.setRemoteDescription(new RTCSessionDescription({ type:'answer', sdp: msg.sdp }))
                        .then(function(){ flushCandidates(); })
                        .catch(function(err){ console.error('setRemote(answer) 失败:', err); });
                    inCall = true;
                    dialPanel.classList.remove('show');
                    hangupBtn2.classList.remove('hidden');
                    setStatus('connected', '与 ' + targetName + ' 通话中');
                }
                break;

            case 'candidate':
                addRemoteCandidate(msg);
                break;

            case 'reject':
                if(callDirection === 'outgoing'){
                    setStatus('idle', targetName + ' 已拒绝');
                    endCall();
                    setTimeout(resetUI, 1500);
                }
                break;

            case 'leave':
                setStatus('idle', '对方已挂断');
                endCall();
                setTimeout(resetUI, 1500);
                break;

            case 'error':
                showError(msg.reason || '信令错误');
                endCall();
                setTimeout(resetUI, 2000);
                break;
        }
    }

    // ===== 通话控制 =====
    window.doLogin = function(){
        var name = loginName.value.trim();
        if(!name){ showLoginError('请输入昵称'); return; }
        hideLoginError();
        loginBtn.disabled = true;
        loginBtn.textContent = '连接中…';
        myName = name;
        connectSignaling(name);
    };

    // 退出登录：主动断开信令并释放昵称
    window.doLogout = function(){
        if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
        if(ws){
            try{ ws.send(JSON.stringify({ type:'logout', from: myName })); }catch(e){}
            try{ ws.close(); }catch(e){}
            ws = null;
        }
        endCall();
        stopMedia();
        sessionStarted = false;
        myName = '';
        logoutBtn.classList.add('hidden');
        hideLoginError();
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
        loginName.value = '';
        showScreen(true);
        resetUI();
        statusBar.classList.remove('show');
    };

    window.startCall = function(){
        var target = targetNameInput.value.trim();
        if(!target){ alert('请输入对方昵称'); return; }
        if(target === myName){ alert('不能呼叫自己'); return; }
        if(!ws || ws.readyState !== WebSocket.OPEN){ alert('信令未连接，请稍候'); return; }

        targetName = target;
        callDirection = 'outgoing';
        awaitingAnswer = true;
        inCall = true;
        incomingPending = false;

        callTargetName.textContent = targetName;
        callStatusText.textContent = '正在呼叫…';
        dialPanel.classList.add('show');
        idlePanel.style.display = 'none';
        hangupBtn2.classList.remove('hidden');
        setStatus('calling', '正在呼叫 ' + targetName);

        createPeerConnection();

        pc.createOffer().then(function(offer){
            return pc.setLocalDescription(offer);
        }).then(function(){
            sendSignaling({ type:'offer', from: myName, to: targetName, sdp: pc.localDescription.sdp });
        }).catch(function(err){
            console.error('创建 Offer 失败:', err);
            showError('创建连接失败');
        });
    };

    window.answerCall = function(){
        if(!incomingPending || !pc) return;
        incomingPending = false;
        answerBtn.classList.add('hidden');
        pc.createAnswer().then(function(a){
            return pc.setLocalDescription(a);
        }).then(function(){
            sendSignaling({ type:'answer', from: myName, to: targetName, sdp: pc.localDescription.sdp });
            inCall = true;
            dialPanel.classList.remove('show');
            hangupBtn2.classList.remove('hidden');
            setStatus('connected', '与 ' + targetName + ' 通话中');
        }).catch(function(err){
            console.error('创建 Answer 失败:', err);
            showError('接听失败');
        });
    };

    window.hangup = function(){
        if(callDirection === 'incoming' && incomingPending){
            // 未接听的来电 → 拒接
            sendSignaling({ type:'reject', from: myName, to: targetName });
        } else {
            sendSignaling({ type:'leave', from: myName, to: targetName });
        }
        endCall();
        resetUI();
    };

    function endCall(){
        closePeer();
        remoteVideo.srcObject = null;
        inCall = false;
        incomingPending = false;
        awaitingAnswer = false;
        callDirection = '';
        targetName = '';
    }

    // ===== 暴露给内联 onclick（须在全局作用域可见） =====
    window.toggleMic = toggleMic;
    window.toggleCam = toggleCam;

    // ===== 大小窗口互换：点小窗(.pip) ↔ 与大窗互换 =====
    function toggleWindow(){
        if(localVideo.classList.contains('pip')){
            // 本地小窗 → 变成主窗
            localVideo.classList.remove('pip');
            remoteVideo.classList.add('pip');
        } else {
            remoteVideo.classList.remove('pip');
            localVideo.classList.add('pip');
        }
    }
    remoteVideo.addEventListener('click', function(){
        if(remoteVideo.classList.contains('pip')) toggleWindow();
    });
    localVideo.addEventListener('click', function(){
        if(localVideo.classList.contains('pip')) toggleWindow();
    });

    // ===== 键盘快捷键 =====
    loginName.addEventListener('keydown', function(e){ if(e.key === 'Enter') window.doLogin(); });
    targetNameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') window.startCall(); });

})();
</script>
</body>
